# To use:
#
#   $ conda env create -f environment.yml  # can use `mamba` too
#   $ conda activate kde-ext
#
name: kde-ext
channels:
  - conda-forge
  - https://software.repos.intel.com/python/conda/
dependencies:
  - python
  - cython
  - numpy
  - scikit-build-core
  - scikit-build
  - cmake>=3.27
  - ninja>=1.11.1
  - pybind11
